services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mern-redis
    networks:
      - mern-network
    restart: always
    command: redis-server --appendonly yes

  # RedisInsight UI
  redisinsight:
    image: redis/redisinsight:latest
    container_name: mern-redisinsight
    ports:
      - "8001:5540"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_NAME=MERN Redis (Production)
    volumes:
      - redisinsight-data:/data
      - ../scripts/redisinsight-init.sh:/init.sh:ro
    networks:
      - mern-network
    restart: always
    depends_on:
      - redis
    command: sh -c "sh /init.sh & /entrypoint.sh"

  # Backend API (Same as local, just production env)
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/dockerfiles/Dockerfile.backend
    container_name: mern-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../../.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - mern-network
    depends_on:
      - redis
    # No health check - same as local

  # Frontend React App (Same as local, just port 80)
  frontend:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/Dockerfile.frontend
      args:
        - REACT_APP_API_URL=http://51.21.127.4:3000
    container_name: mern-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  redisinsight-data:

