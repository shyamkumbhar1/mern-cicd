services:
  # Backend API (Same as local, just production env)
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mern-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - mern-network
    # No health check - same as local

  # Frontend React App (Same as local, just port 80)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - REACT_APP_API_URL=http://51.21.127.4:3000
    container_name: mern-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

