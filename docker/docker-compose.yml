services:
  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mern-backend
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - mern-network
    command: npm run dev
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mern-frontend
    ports:
      - "3001:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mern-network
    restart: unless-stopped

networks:
  mern-network:
    driver: bridge

