name: CI/CD Pipeline

on:
  push:
    branches:
      - main        # Production
      - develop     # Dev
      - pre-prod    # Pre-production
  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  AWS_EC2_IP: 51.21.127.4
  AWS_USER: ubuntu

jobs:
  # Test Jobs (Parallel - Backend & Frontend run simultaneously)
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]') && !contains(github.event.head_commit.message, '[fast]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Cache Backend Dependencies
        uses: actions/cache@v3
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-node-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install
      
      - name: Run Backend Tests
        run: |
          cd backend
          npm test || echo "No tests configured"
        continue-on-error: true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]') && !contains(github.event.head_commit.message, '[fast]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Cache Frontend Dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-
      
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install
      
      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --watchAll=false || echo "No tests configured"
        continue-on-error: true

  # Build Job (Parallel builds with cache)
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Build Backend Image (with cache)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./docker/dockerfiles/Dockerfile.backend
          push: false
          tags: mern-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image (with cache)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/dockerfiles/Dockerfile.frontend
          push: false
          tags: mern-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production (No need to wait for build - deploy directly)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://51.21.127.4
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.AWS_EC2_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Production
        timeout-minutes: 15
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -o ConnectTimeout=10 \
            ${{ env.AWS_USER }}@${{ env.AWS_EC2_IP }} << 'EOF'
            # Setup project directory if it doesn't exist
            if [ ! -d ~/MERN-prod ]; then
              echo "📦 Cloning repository..."
              git clone https://github.com/shyamkumbhar1/mern-cicd-new.git ~/MERN-prod
              cd ~/MERN-prod
            else
              cd ~/MERN-prod
              echo "🔄 Pulling latest changes..."
              # Reset any local changes and pull latest
              git reset --hard HEAD || true
              git clean -fd || true
              git pull origin main || true
            fi
            
            # Ensure Docker is running
            sudo systemctl start docker || true
            
            # Fast deployment - only rebuild if needed
            echo "🔄 Fast deployment mode..."
            
            # Check if containers are running
            if docker ps --format "{{.Names}}" | grep -q "mern-frontend\|mern-backend"; then
              echo "📦 Containers running - Quick update mode"
              # Stop only frontend (if only frontend changed)
              docker stop mern-frontend 2>/dev/null || true
              # Rebuild only frontend (fastest - uses cache, no progress output for speed)
              docker-compose -f docker/compose/docker-compose.prod.yml build --quiet frontend 2>/dev/null || docker-compose -f docker/compose/docker-compose.prod.yml build frontend
              # Restart frontend (no recreate, faster)
              docker-compose -f docker/compose/docker-compose.prod.yml up -d --no-deps frontend || docker-compose -f docker-compose.prod.yml up -d --no-deps frontend
            else
              echo "📦 First deployment - Full setup"
              # Stop existing containers
              docker-compose -f docker/compose/docker-compose.prod.yml stop || docker-compose -f docker-compose.prod.yml stop || true
              docker rm -f mern-frontend mern-backend mern-redis mern-redisinsight 2>/dev/null || true
              # Build with cache
              docker-compose -f docker/compose/docker-compose.prod.yml build --parallel || docker-compose -f docker-compose.prod.yml build --parallel
              # Start all containers
              docker-compose -f docker/compose/docker-compose.prod.yml up -d || docker-compose -f docker-compose.prod.yml up -d
            fi
            
            # Quick verification (no wait for fast mode)
            if echo "${{ github.event.head_commit.message }}" | grep -q "\[fast\]"; then
              echo "⚡ Fast mode - skipping wait"
            else
              sleep 5
            fi
            
            # Verify containers are running
            echo "📊 Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOF
      
      - name: Quick Health Check
        run: |
          echo "🔍 Quick health check..."
          # For fast mode or frontend-only changes, minimal wait
          if echo "${{ github.event.head_commit.message }}" | grep -q "\[fast\]\|\[frontend\]\|\[ui\]"; then
            echo "⚡ Fast mode - minimal health check"
            sleep 3
            if curl -f -s --max-time 3 http://${{ env.AWS_EC2_IP }}:3000/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
            else
              echo "⚠️  Backend may still be starting (normal for fast mode)"
            fi
          else
            sleep 15
            if curl -f -s --max-time 5 http://${{ env.AWS_EC2_IP }}:3000/health > /dev/null 2>&1; then
              echo "✅ Backend health check passed!"
            else
              echo "⚠️  Health check skipped (backend might still be starting)"
              echo "💡 Check manually: http://${{ env.AWS_EC2_IP }}:3000/health"
            fi
          fi
      
      - name: Open Security Group Ports
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ ! -z "$AWS_ACCESS_KEY_ID" ]; then
            aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
            aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
            aws configure set region ${{ env.AWS_REGION }}
            
            SG_ID=$(aws ec2 describe-instances \
              --filters "Name=ip-address,Values=${{ env.AWS_EC2_IP }}" \
              --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
              --output text 2>/dev/null || echo "")
            
            if [ ! -z "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              for port in 80 3000 8001; do
                aws ec2 authorize-security-group-ingress \
                  --group-id $SG_ID \
                  --protocol tcp \
                  --port $port \
                  --cidr 0.0.0.0/0 2>/dev/null || echo "Port $port may already be open"
              done
            fi
          fi

  # Deploy to Dev
  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: dev
      url: http://51.21.127.4:3001
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.AWS_EC2_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Dev
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.AWS_USER }}@${{ env.AWS_EC2_IP }} << 'EOF'
            cd ~/MERN-dev || cd ~/MERN
            git pull origin develop || true
            docker-compose -f docker/compose/docker-compose.dev.yml down || docker-compose -f docker-compose.yml down
            docker-compose -f docker/compose/docker-compose.dev.yml build || docker-compose -f docker-compose.yml build
            docker-compose -f docker/compose/docker-compose.dev.yml up -d || docker-compose -f docker-compose.yml up -d
          EOF

  # Deploy to Pre-prod
  deploy-preprod:
    name: Deploy to Pre-prod Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/pre-prod' && github.event_name == 'push'
    environment:
      name: pre-prod
      url: http://51.21.127.4:8080
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.AWS_EC2_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Pre-prod
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ env.AWS_USER }}@${{ env.AWS_EC2_IP }} << 'EOF'
            cd ~/MERN-preprod || cd ~/MERN
            git pull origin pre-prod || true
            docker-compose -f docker/compose/docker-compose.preprod.yml down || docker-compose -f docker-compose.preprod.yml down
            docker-compose -f docker/compose/docker-compose.preprod.yml build || docker-compose -f docker-compose.preprod.yml build
            docker-compose -f docker/compose/docker-compose.preprod.yml up -d || docker-compose -f docker-compose.preprod.yml up -d
          EOF

